[project]
name = "citeck-claude-code-tools"
version = "3.0.0"
description = "MCP server for Citeck ECOS platform integration with Claude Code and Codex"
# uv starts the server on the newest installed CPython in this range. Raise the upper bound
# only after `uv lock` resolves wheels for the new release (tests/test_plugin_packaging.py).
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastmcp>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
